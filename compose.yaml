services:
  ambergate:
    build: .
    image: local/ambergate:latest
    restart: unless-stopped
    ports:
      - "80:80"
      # Optional managed TLS: use -f compose.tls.yaml to publish port 443.
      - "127.0.0.1:8083:8083"
    environment:
      # Optional: set in .env before FIRST startup. Otherwise a password is
      # generated once and printed in docker compose logs ambergate.
      AMBERGATE_ADMIN_PASSWORD: ${AMBERGATE_ADMIN_PASSWORD:-${GATEWAY_ADMIN_PASSWORD:-}}
      AMBERGATE_SECURE_COOKIE: ${AMBERGATE_SECURE_COOKIE:-${GATEWAY_SECURE_COOKIE:-false}}
      AMBERGATE_ADMIN_TRUSTED_PROXIES: ${AMBERGATE_ADMIN_TRUSTED_PROXIES:-}
      AMBERGATE_AGENT_TARGET_LIMIT: ${AMBERGATE_AGENT_TARGET_LIMIT:-128}
    volumes:
      - ambergate-data:/data
      - ambergate-cache:/cache
    networks:
      - ambergate
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ambergate-data:
  ambergate-cache:

networks:
  ambergate:
    name: ambergate
