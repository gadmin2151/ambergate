name: AmberGate · Build & publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test the Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JavaScript and Compose
        run: |
          bash -n first-start.sh
          node --check ambergate/static/i18n.js
          node --check ambergate/static/app.js
          node --check ambergate/static/dashboard.js
          node --check ambergate/static/docker.js
          node --test tests/*.test.js
          docker compose -f examples/docker-labels.compose.yaml --profile advanced --profile group --profile host config --quiet
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.docker.yaml config --quiet
          docker compose -f compose.ghcr.yaml -f compose.docker.yaml config --quiet

      - name: Check first-start installation on Debian
        run: |
          docker run --rm \
            -v "$PWD/first-start.sh:/first-start.sh:ro" \
            -v "$PWD/tests/installer_smoke.sh:/installer-smoke.sh:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            debian:12-slim bash /installer-smoke.sh

      - name: Build the image
        run: docker build --pull -t ambergate:ci .

      - name: Test routing, cache, security and reload with real Nginx
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD/tests:/app/tests:ro" \
            ambergate:ci -m unittest discover -v

      - name: Discover and balance real Docker containers
        run: python3 tests/docker_smoke.py

      - name: Smoke-test the actual container entrypoint
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs ambergate-smoke; docker rm -f ambergate-smoke' EXIT
          docker run -d --name ambergate-smoke \
            -p 127.0.0.1:18083:8083 \
            -e AMBERGATE_ADMIN_PASSWORD=ci-only-disposable-password \
            ambergate:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18083/healthz; then
              curl --fail --silent http://127.0.0.1:18083/ | grep -q 'AmberGate'
              exit 0
            fi
            sleep 1
          done
          exit 1

  publish:
    name: Publish to GHCR (amd64 + arm64)
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable ARM builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ambergate" >> "$GITHUB_OUTPUT"

      - name: Tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=AmberGate
            org.opencontainers.image.description=AmberGate — HTTP routing, Docker discovery and live monitoring in one container.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Published image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Published Docker image'
            echo
            echo 'Platforms: `linux/amd64`, `linux/arm64`'
            echo
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
            echo
            echo "Immutable reference: \`$IMAGE_NAME@$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
