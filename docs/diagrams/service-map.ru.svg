<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">AmberGate — карта сервисов</title><desc id="desc">Логическая карта: клиенты, внешний TLS, один центральный gateway, локальные приложения и два исходящих агента.</desc>
